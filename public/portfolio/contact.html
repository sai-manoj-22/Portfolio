<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js" defer></script>

<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="ambient" aria-hidden="true"><span></span></div>
<div class="grid-overlay" aria-hidden="true"></div>
<header data-header></header>
<main id="main">
<section class="page-top"><div class="container">
<span class="eyebrow reveal">Contact</span>
<h1 class="title-lg reveal" style="--d:.05s">Let's <span class="grad-text">connect</span>.</h1>
<p class="lead reveal" style="--d:.1s">Open to SDE internships, placements and collaboration. I usually reply over email.</p></div></section>
<section class="section" style="padding-top:2rem"><div class="container grid grid-2">
<div class="card reveal"><h2 class="title-md">Contact details</h2>
<div class="contact-item"><div class="icon-chip" style="margin:0"><i data-lucide="mail"></i></div><div><small>Email</small><a href="mailto:saimanojmbhs@gmail.com">saimanojmbhs@gmail.com</a></div></div>
<div class="contact-item"><div class="icon-chip" style="margin:0"><i data-lucide="phone"></i></div><div><small>Phone</small><a href="tel:+919618387772">+91 9618387772</a></div></div>
<div class="contact-item"><div class="icon-chip" style="margin:0"><i data-lucide="map-pin"></i></div><div><small>Based in</small>Warangal, Telangana</div></div>
<div style="margin-top:1.4rem" data-social="linkedin,github,leetcode,codeforces"></div></div>
<form class="card form reveal" id="contact-form" novalidate style="--d:.08s">
<h2 class="title-md">Send a message</h2>
<div class="field"><label for="name">Name</label><input id="name" name="name" autocomplete="name" maxlength="100" required><span class="err" aria-live="polite"></span></div>
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" maxlength="255" required><span class="err" aria-live="polite"></span></div>
<div class="field"><label for="subject">Subject</label><input id="subject" name="subject" maxlength="150" required><span class="err" aria-live="polite"></span></div>
<div class="field"><label for="message">Message</label><textarea id="message" name="message" maxlength="2000" required></textarea><span class="err" aria-live="polite"></span></div>
<button class="btn btn-primary" type="submit">Send Message</button>
<div id="form-status" class="form-status" role="status"></div>
</form></div></section>
</main>
<footer data-footer></footer>
</body>
</html>
